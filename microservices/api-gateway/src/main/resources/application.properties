spring.application.name=api-gateway
server.port:8090
#Rutas del microservicio de clientes
spring.cloud.gateway.server.webflux.routes[0].id=cliente
spring.cloud.gateway.server.webflux.routes[0].uri=lb://localhost:8091
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/cliente/**
#Rutas del microservicio de cuentas
spring.cloud.gateway.server.webflux.routes[1].id=ms-cuentas
spring.cloud.gateway.server.webflux.routes[1].uri=lb://localhost:8092
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/cuentas/**
#Rutas del microservicio de movimientos
spring.cloud.gateway.server.webflux.routes[2].id=ms-movimientos
spring.cloud.gateway.server.webflux.routes[2].uri=lb://localhost:8093
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/movimientos/**

#Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8085/eureka
eureka.instance.instance-id =${spring.application.name}:${spring.application.instance_id:${random.value}}